root.querySelector('#tn-count').textContent=`${data.nodes.length} topics · ${data.edges.length} close_theme pairs · ${data.components} connected components`;
const view=el('g',{},svg),edgeLayer=el('g',{},view),nodeLayer=el('g',{},view),labelLayer=el('g',{},svg);
const neighbors=data.nodes.map(()=>new Set());
const edges=data.edges.map(e=>{neighbors[e.a].add(e.b);neighbors[e.b].add(e.a);const a=data.nodes[e.a],b=data.nodes[e.b];return el('path',{class:'tn-edge'},edgeLayer);});
const nodes=data.nodes.map((n,i)=>{
 const p=el('path',{d:shape(n.s),transform:`translate(${n.x},${n.y})`,fill:colors[n.c],class:'tn-node cursor-interaction','data-tooltip':`${n.path} · ${neighbors[i].size} connections`},nodeLayer);
 p.addEventListener('click',e=>{e.stopPropagation();if(!moved)choose(selected===i?null:i,true);});
 return p;
});
let selected=null, scale=1, tx=0,ty=0,width=700,height=660,drag=null,moved=false;
function apply(){view.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);drawLabels();}
const labels=data.nodes.map((n,i)=>{const label=el('text',{class:'tn-label','data-topic':n.path},labelLayer);label.textContent=n.path;return label;});
function drawLabels(){data.nodes.forEach((n,i)=>{const x=n.x*scale+tx,y=n.y*scale+ty;const label=labels[i];label.setAttribute('x',x+13);label.setAttribute('y',y+4);label.setAttribute('text-anchor','start');label.querySelectorAll('tspan').forEach(t=>t.setAttribute('x',x+13));});}
function choose(i,save=false){
 selected=i;
 nodes.forEach((p,j)=>p.style.opacity=i===null||i===j||neighbors[i].has(j)?1:.3);
 labels.forEach((p,j)=>p.style.opacity=i===null||i===j||neighbors[i].has(j)?1:.35);
 edges.forEach((p,j)=>{const e=data.edges[j],on=i===null||e.a===i||e.b===i;p.style.strokeOpacity=on?(i===null?.65:.95):.18;p.style.strokeWidth=i!==null&&on?2.5:1.5;});
 detail.textContent=i===null?'Click a topic to highlight its connections. Scroll to browse; Ctrl/⌘ + scroll to zoom; drag to pan.':`${data.nodes[i].path} · ${neighbors[i].size} related topics`;
 drawLabels();
 if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedTopic:i===null?null:data.nodes[i].path},privateContent:{selected:i}}).catch(()=>{});
}
svg.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const box=svg.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top,next=Math.max(.15,Math.min(8,scale*Math.exp(-e.deltaY*.0015))),ratio=next/scale;tx=x-(x-tx)*ratio;ty=y-(y-ty)*ratio;scale=next;apply();},{passive:false});
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};moved=false;});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;tx=drag.tx+dx;ty=drag.ty+dy;apply();}});
window.addEventListener('pointerup',()=>drag=null);
svg.addEventListener('click',e=>{if(!moved&&e.target===svg)choose(null,true);});
const components=[];const unseen=new Set(data.nodes.map((_,i)=>i));
while(unseen.size){const start=unseen.values().next().value,group=[],stack=[start];unseen.delete(start);while(stack.length){const i=stack.pop();group.push(i);for(const j of neighbors[i])if(unseen.has(j)){unseen.delete(j);stack.push(j);}}group.sort((a,b)=>data.nodes[a].path.localeCompare(data.nodes[b].path));components.push(group);}
components.sort((a,b)=>b.length-a.length||a[0]-b[0]);
function layout(){
 width=svg.clientWidth;const cols=width>=1150?3:width>=750?2:1,gap=22,cw=(width-gap*(cols-1))/cols,heights=Array(cols).fill(22),arc=Math.min(95,cw*.2),textWidth=cw-arc-30;
 for(const group of components){const col=heights.indexOf(Math.min(...heights)),base=col*(cw+gap),x=base+arc;let y=heights[col];
  for(const i of group){const label=labels[i],path=data.nodes[i].path;label.textContent='';let lines=[],line='';
   for(const ch of path){label.textContent=line+ch;if(label.getComputedTextLength()>textWidth&&line){lines.push(line);line=ch;}else line+=ch;}if(line)lines.push(line);
   label.textContent='';lines.forEach((line,j)=>{const t=el('tspan',{x:x+13,dy:j?15:0},label);t.textContent=line;});
   data.nodes[i].x=x;data.nodes[i].y=y;nodes[i].setAttribute('transform',`translate(${x},${y})`);y+=Math.max(26,lines.length*15+10);
  }heights[col]=y+34;
 }
 height=Math.max(...heights);svg.style.height=height+'px';svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 edges.forEach((p,j)=>{const e=data.edges[j],a=data.nodes[e.a],b=data.nodes[e.b],spread=Math.min(arc-9,18+Math.abs(b.y-a.y)*.35);p.setAttribute('d',`M${a.x},${a.y} C${a.x-spread},${a.y} ${b.x-spread},${b.y} ${b.x},${b.y}`);});
 scale=1;tx=0;ty=0;apply();
}
let lastWidth=0;new ResizeObserver(()=>{if(svg.clientWidth!==lastWidth){lastWidth=svg.clientWidth;layout();}}).observe(svg);
const saved=window.openai?.widgetState?.privateContent?.selected;if(Number.isInteger(saved)&&data.nodes[saved])choose(saved);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.selected;if(s===null||Number.isInteger(s)&&data.nodes[s])choose(s);});
})();
</script>
