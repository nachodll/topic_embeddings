<script>
const rows=JSON.parse(document.getElementById('data').textContent),groups=new Map();
for(const r of rows){if(!groups.has(r.relation))groups.set(r.relation,[]);groups.get(r.relation).push(r)}
const topics=[...new Set(rows.flatMap(r=>['a','b','c','d'].map(k=>r['topic_path_'+k])))];
const cats=[...new Set(topics.map(p=>p.split('/')[0]))].sort();
// As in the close-theme network, shapes distinguish Topic 2 within each Topic 1 color.
const topic2Shapes=new Map(cats.map(cat=>[cat,[...new Set(topics.filter(p=>p.split('/')[0]===cat).map(p=>p.split('/')[1]))].sort()]));
const shapePaths=[
 'M0,-5 A5,5 0 1,1 0,5 A5,5 0 1,1 0,-5',
 'M-5,-5 H5 V5 H-5 Z',
 'M0,-6 L6,0 L0,6 L-6,0 Z',
 'M0,-6 L6,5 L-6,5 Z',
 'M-6,-5 L6,-5 L0,6 Z',
 'M-2,-6 H2 V-2 H6 V2 H2 V6 H-2 V2 H-6 V-2 H-2 Z'
];
const colors=new Map(cats.map((c,i)=>[c,`light-dark(hsl(${i*137.508%360} 60% 38%),hsl(${i*137.508%360} 65% 70%))`]));
document.getElementById('counts').textContent=`${rows.length} analogy candidates · ${groups.size} relation types · ${topics.length} unique topics`;
for(const cat of cats){const s=document.createElement('span'),dot=document.createElement('i');dot.className='swatch';dot.style.background=colors.get(cat);s.append(dot,document.createTextNode(cat));document.getElementById('legend').append(s)}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
function show(title,rs){document.getElementById('detail-title').textContent=title;const box=document.getElementById('details');box.replaceChildren();for(const r of rs){const a=document.createElement('article');for(const [cls,text]of [['meta',r.analogy_id+' · '+r.label],['formula',r.topic_path_a+' : '+r.topic_path_b+' :: '+r.topic_path_c+' : '+r.topic_path_d],['',r.notes],['meta',r.user_judgment?'Judgment: '+r.user_judgment:'']]){if(!text)continue;const p=document.createElement('p');p.className=cls;p.textContent=text;a.append(p)}box.append(a)}document.getElementById('detail').showModal()}
document.getElementById('close').onclick=()=>document.getElementById('detail').close();
let serial=0;
for(const [relation,rs] of groups){
 const section=document.createElement('section'),heading=document.createElement('h2'),meta=document.createElement('div');heading.textContent=relation;meta.className='meta';section.append(heading,meta);document.getElementById('groups').append(section);
 const paths=[...new Set(rs.flatMap(r=>['a','b','c','d'].map(k=>r['topic_path_'+k])))].sort();
 const pairs=new Map();for(const r of rs)for(const [a,b]of [['a','b'],['c','d']]){const src=r['topic_path_'+a],dst=r['topic_path_'+b],key=JSON.stringify([src,dst]);if(!pairs.has(key))pairs.set(key,{src,dst,rows:[]});if(!pairs.get(key).rows.includes(r))pairs.get(key).rows.push(r)}
 meta.textContent=`${[...new Set(rs.map(r=>r.label))].join(" / ")} · ${rs.length} analogies · ${paths.length} topics · ${pairs.size} directed pairs`;
 const list=document.createElement("div");list.className="pair-list";section.append(list);
 for(const pair of pairs.values()){
  const button=document.createElement("button");button.type="button";button.className="pair-row";
  button.setAttribute("aria-label",pair.src+" → "+pair.dst);
  for(const [i,path] of [pair.src,pair.dst].entries()){
   if(i){const arrow=document.createElement("span");arrow.className="pair-arrow";arrow.textContent="→";arrow.setAttribute("aria-hidden","true");button.append(arrow)}
   const topic=document.createElement("span");topic.className="pair-topic";
   const [topic1,topic2]=path.split('/'),shapeIndex=topic2Shapes.get(topic1).indexOf(topic2);
   const dot=document.createElementNS(NS,'svg');dot.setAttribute('viewBox','-8 -8 16 16');dot.setAttribute('width','16');dot.setAttribute('height','16');dot.style.flexShrink='0';dot.setAttribute('aria-hidden','true');dot.dataset.topic2=topic2;dot.dataset.shape=shapeIndex;
   el('path',{d:shapePaths[shapeIndex],fill:colors.get(topic1)},dot);
   const label=document.createElement("span");label.textContent=path;topic.append(dot,label);button.append(topic);
  }
  button.onclick=()=>show(relation+" · directed pair",pair.rows);list.append(button);
 }

}
